{% extends "base.html" %}

{% block title %}Access Forbidden (403){% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <h1 class="display-1 fw-bold text-warning brand-font">403</h1>
        <h3 class="fw-bold mb-3">Administrative Access Required</h3>
        <p class="text-secondary mb-4">Your current staff role does not possess authorization to execute this operation.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom">
            <i class="bi bi-house me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
