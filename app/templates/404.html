{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <h1 class="display-1 fw-bold text-muted brand-font">404</h1>
        <h3 class="fw-bold mb-3">Resource Not Located</h3>
        <p class="text-secondary mb-4">The bank resource or URL requested does not exist or has been relocated.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom">
            <i class="bi bi-house me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
