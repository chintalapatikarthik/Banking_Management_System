{% extends "base.html" %}

{% block title %}Internal Server Error (500){% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <h1 class="display-1 fw-bold text-danger brand-font">500</h1>
        <h3 class="fw-bold mb-3">System Processing Error</h3>
        <p class="text-secondary mb-4">An unexpected exception occurred while processing the database or application request.</p>
        {% if error %}
        <div class="alert alert-danger font-monospace small text-start">{{ error }}</div>
        {% endif %}
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom">
            <i class="bi bi-house me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
