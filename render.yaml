services:
  - type: web
    name: banking-management-system
    env: python
    buildCommand: pip install -r requirements.txt && python database/init_db.py
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///banking.db
      - key: DEFAULT_ADMIN_USERNAME
        value: admin
      - key: DEFAULT_ADMIN_PASSWORD
        value: Admin@123
      - key: DEFAULT_EMPLOYEE_USERNAME
        value: employee
      - key: DEFAULT_EMPLOYEE_PASSWORD
        value: Employee@123
